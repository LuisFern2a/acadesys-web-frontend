<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon principal de la pestaña: GIF animado (A teal + birrete).
         Se declara primero y sin `sizes` para que el navegador lo prefiera.
         Los PNG quedan como respaldo (manifest/PWA, iOS y navegadores que no
         animan GIF). -->
    <link rel="icon" type="image/gif" href="/acadesys-favicon-animado.gif" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/acadesys-favicon.png" />
    <link rel="apple-touch-icon" href="/acadesys-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AcadeSys - Academia Preuniversitaria</title>
    <meta name="theme-color" content="#0F172A" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Tipografía de AcadeSys: "Archivo" (libre, Google Fonts).
         Alternativa visualmente cercana a Geogrotesque (comercial, NO utilizada).
         La familia global se centraliza en src/index.css (--font-acadesys). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased m-0 p-0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
