<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/acadesys-favicon.png" />
    <link rel="apple-touch-icon" href="/acadesys-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AcadeSys - Intranet Escolar</title>
    <meta name="theme-color" content="#1e3a8a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Tipografía de AcadeSys: "Archivo" (libre, Google Fonts).
         Alternativa visualmente cercana a Geogrotesque (comercial, NO utilizada).
         La familia global se centraliza en src/index.css (--font-acadesys). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-100 text-slate-800 antialiased m-0 p-0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((reg) => console.log('SW registrado correctamente:', reg.scope))
            .catch((err) => console.error('Error registrando SW:', err));
        });
      }
    </script>
  </body>
</html>
